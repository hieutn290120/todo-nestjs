services:
  mailcatcher:
    restart: on-failure
    image: dockage/mailcatcher:0.9.0
    ports:
    - "1080:1080"
    - "1025:1025"
  fot-minio:
    image: minio/minio:RELEASE.2021-11-09T03-21-45Z
    container_name: fot-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=minio123
    entrypoint: sh
    command: -c "
      mkdir -p /data/.minio.sys/buckets;
      cp -r /policies/* /data/.minio.sys/;
      cp -r /export/* /data/;
      /opt/bin/minio server /data --console-address ":9091";
      "
    volumes:
      - minio:/data
      - ./minio/export:/export
      - ./minio/policies:/policies
volumes:
  minio:
